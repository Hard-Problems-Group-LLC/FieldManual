]

project_config_template = "FieldManual-config.toml"
local_config_template = "FieldManual-localconfig.toml"
project_config_path = "FieldManual-config.toml"
local_config_path = ".local/FieldManual-localconfig.toml"

agents_header_template = "AGENTS-header.md"
agents_footer_template = "AGENTS-footer.md"
agents_path = "AGENTS.md"

gitignore_path = ".gitignore"
gitignore_entries = [
  ".local/",
]
